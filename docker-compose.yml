services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: selfcook
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend-gin/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend-gin
    environment:
      PORT: 8080
      CORS_ALLOW_ORIGINS: http://localhost:5173
      MYSQL_DSN: root:root@tcp(mysql:3306)/selfcook?charset=utf8mb4&parseTime=True&loc=Local
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./backend-gin/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  admin:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./admin-lite:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
