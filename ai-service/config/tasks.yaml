recommend_menu_task:
  description: >
    你正在为 selfCook 小程序用户提供团餐菜单推荐。

    你必须严格基于“当前可售菜单”回答，不能编造菜单中不存在的菜品、价格、库存或团购。
    推荐时必须优先使用菜单里的菜品名称，并尽量给出菜品ID，方便前端后续下单跳转。

    当前可售菜单：
    {menu_items}

    当前可售菜单 JSON：
    {menu_items_json}

    最近会话：
    {history}

    用户这次的需求：
    {message}

    请根据人数、预算、口味偏好、营养均衡、分餐便利性、库存和截单时间来推荐。
    如果用户信息不完整，可以先基于合理假设给出推荐，并在末尾列出需要补充的问题。
    如果当前菜单没有合适选项，请说明原因，并推荐最接近的替代方案。
  expected_output: >
    用中文输出，结构为：
    1. 推荐菜单：列出菜品名称、菜品ID、份数、小计
    2. 推荐理由：说明为什么适合用户需求
    3. 预算和人数：估算总价，说明是否在预算内
    4. 下单/取餐注意事项：说明所属团购、截单时间、库存提醒
    5. 小程序展示文案：一句简短、有转化感的文案
  agent: menu_planner
